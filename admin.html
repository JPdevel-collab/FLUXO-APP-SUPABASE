<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c6ecf7">
<title>Fluxo · Admin</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c2a3a;--mut:#4f7080;--p1:#00b0d0;--p2:#0070b8;--line:rgba(0,110,160,.14);--card:rgba(255,255,255,.88)}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(180deg,#c6ecf7,#eefbfe) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);margin-top:10px}
.login{max-width:360px;margin:12vh 16px 0;margin-inline:auto;text-align:center;padding:28px 22px;background:var(--card);border:1px solid var(--line);border-radius:26px}
.login img{width:60px}.login h2{margin-top:8px}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:99px;color:#fff;font-weight:600;background:linear-gradient(90deg,var(--p1),var(--p2))}
#msg{color:#c0392b;font-size:14px;margin-top:10px;min-height:18px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top img{width:34px}.top h1{font-size:22px;flex:1}.top small{font-size:14px;color:var(--p2);font-weight:500}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px}
.tabs .on{color:#fff;background:linear-gradient(90deg,var(--p1),var(--p2));border-color:transparent}
.o{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.o.new{border-color:var(--p1);box-shadow:0 0 0 3px rgba(0,176,208,.22)}
.o h3{font-size:17px;display:flex;justify-content:space-between;gap:8px}
.o h3 small{font-weight:400}.o small{color:var(--mut)}
.o p{margin-top:6px;font-size:14px}
.o a{color:var(--p2);font-weight:500;text-decoration:none}
.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.st button{padding:7px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line);background:#fff}
.st .on{color:#fff;background:var(--p2);border-color:var(--p2)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<div id="L" class="login">
  <img src="icon-192.png" alt=""><h2>Admin Fluxo</h2>
  <input id="em" type="email" placeholder="Correo" autocomplete="username">
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button class="btn" id="in">Entrar</button><div id="msg"></div>
</div>
<div id="A" class="wrap" hidden>
  <div class="top"><img src="icon-192.png" alt=""><h1>Pedidos <small id="cnt"></small></h1><button id="out">Salir</button></div>
  <div class="tabs" id="tabs"><button data-f="act" class="on">Activos</button><button data-f="done">Listos</button><button data-f="all">Todos</button></div>
  <div id="list"></div>
</div>
<script>
const U='https://vwggacuclsipxgfiiuvd.supabase.co',K='sb_publishable_mt5_YNbP8iLMp-7jnV8NLw_FTxD1jAu';
const $=s=>document.querySelector(s);
const ST=[['recibido','Recibido'],['diagnostico','Diagnóstico'],['reparacion','En reparación'],['listo','Listo']];
let S=null,F='act',D=[],seen=null,AC,timer;const news=new Set();
try{S=JSON.parse(localStorage.getItem('fxs'))}catch(e){}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=s=>new Date(s).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

async function auth(body,type){
  const r=await fetch(`${U}/auth/v1/token?grant_type=${type}`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'No se pudo entrar');
  S={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000};
  try{localStorage.setItem('fxs',JSON.stringify(S))}catch(e){}
}
async function api(path,opt={}){
  if(S.exp<Date.now()){try{await auth({refresh_token:S.refresh_token},'refresh_token')}catch(e){throw new Error('401')}}
  const r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:{apikey:K,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json',...opt.headers}});
  if(r.status===401)throw new Error('401');
  if(!r.ok)throw new Error(r.status);
  return r.status===204?null:r.json();
}
function beep(){try{AC=AC||new AudioContext();AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.5);o.start();o.stop(AC.currentTime+.5)}catch(e){}}
function show(on){$('#L').hidden=on;$('#A').hidden=!on;clearInterval(timer);if(on){load();timer=setInterval(load,6000)}}
function logout(){try{localStorage.removeItem('fxs')}catch(e){}S=null;seen=null;show(false)}
async function load(){
  try{D=await api('orders?select=*&order=created_at.desc&limit=200')}
  catch(e){if(e.message==='401')logout();return}
  if(seen){const f=D.filter(o=>!seen.has(o.id));if(f.length){f.forEach(o=>news.add(o.id));beep()}}
  seen=new Set(D.map(o=>o.id));render();
}
function render(){
  const nw=D.filter(o=>o.status==='recibido').length;
  $('#cnt').textContent=nw?'· '+nw+(nw==1?' nuevo':' nuevos'):'';
  document.title=(nw?'('+nw+') ':'')+'Fluxo · Admin';
  const L=D.filter(o=>F==='all'||(F==='act'?o.status!=='listo':o.status==='listo'));
  $('#list').innerHTML=L.length?L.map(o=>`<div class="o${news.has(o.id)&&o.status==='recibido'?' new':''}"><h3><span>${esc(o.code)} · ${esc(o.name)}</span><small>${fmt(o.created_at)}</small></h3><p><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p><p>${esc([o.service,o.device].filter(Boolean).join(' · '))}</p>${o.issue?`<p><small>${esc(o.issue)}</small></p>`:''}<div class="st">${ST.map(([v,n])=>`<button data-id="${o.id}" data-s="${v}" class="${o.status===v?'on':''}">${n}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Sin pedidos aquí</div>';
}
$('#list').onclick=async e=>{
  const b=e.target.closest('button[data-s]');if(!b)return;
  const o=D.find(x=>x.id===b.dataset.id);if(!o||o.status===b.dataset.s)return;
  const old=o.status;o.status=b.dataset.s;render();
  try{await api('orders?id=eq.'+o.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:o.status})})}
  catch(err){o.status=old;render();alert('No se pudo guardar el cambio')}
};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;F=b.dataset.f;[...$('#tabs').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('#in').onclick=async()=>{
  $('#msg').textContent='';
  try{AC=AC||new AudioContext()}catch(e){}
  try{await auth({email:$('#em').value.trim(),password:$('#pw').value},'password');show(true)}
  catch(e){$('#msg').textContent=/invalid/i.test(e.message)?'Correo o contraseña incorrectos':e.message}
};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#in').click()};
$('#out').onclick=logout;
if(S)show(true);
</script>
</body>
</html>
